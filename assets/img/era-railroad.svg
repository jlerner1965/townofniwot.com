<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d"><title id="t">Colorado Central Railroad, 1873</title><desc id="d">Illustration of a steam locomotive pulling grain cars past a small wooden depot and water tower, smoke trailing toward the Front Range.</desc>
